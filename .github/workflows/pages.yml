name: Verify and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Reject tracked private source files
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(git ls-files -- '*.xlsx' '*.XLSX')"
          if [[ -n "$tracked_files" ]]; then
            echo "Tracked Excel files are not allowed:"
            echo "$tracked_files"
            exit 1
          fi

          tracked_private="$(git ls-files -- 'data/private/**')"
          if [[ -n "$tracked_private" ]]; then
            echo "Private player registry files must not be tracked:"
            echo "$tracked_private"
            exit 1
          fi

      - name: Reject public plaintext JSON
        shell: bash
        run: |
          set -euo pipefail
          unexpected_json="$(find apps/web/public -type f -iname '*.json' ! -path 'apps/web/public/archives/index.json' -print)"
          if [[ -n "$unexpected_json" ]]; then
            echo "Only the non-secret archive index may be public JSON:"
            echo "$unexpected_json"
            exit 1
          fi

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Test Python tools
        run: python -m pytest

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Inspect production artifact
        shell: bash
        run: |
          set -euo pipefail

          if find apps/web/dist -type f -iname '*.xlsx' -print -quit | grep -q .; then
            echo "Excel files must not be included in the production artifact."
            exit 1
          fi

          if find apps/web/dist \( -path '*/data/raw' -o -path '*/data/raw/*' -o -path '*/data/plain' -o -path '*/data/plain/*' -o -path '*/data/private' -o -path '*/data/private/*' \) -print -quit | grep -q .; then
            echo "data/raw, data/plain, or data/private must not be included in the production artifact."
            exit 1
          fi

          unexpected_json="$(find apps/web/dist -type f -iname '*.json' ! -path 'apps/web/dist/archives/index.json' -print)"
          if [[ -n "$unexpected_json" ]]; then
            echo "Plaintext or unexpected JSON was found in the production artifact:"
            echo "$unexpected_json"
            exit 1
          fi

          test -f apps/web/dist/archives/index.json
          test -n "$(find apps/web/dist/archives -type f -name '*.enc' -print -quit)"
          grep -q '/jong-support/assets/' apps/web/dist/index.html

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
